name: Validate

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Catch new hassfest and HACS rules between releases
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration

  lint:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: pip install ruff==0.17.3
      - run: ruff check .
      - run: ruff format --check .

  tests:
    name: Tests (Home Assistant ${{ matrix.homeassistant }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Minimum version declared in hacs.json
          - homeassistant: "2025.4.0"
            python: "3.13"
            install: pytest-homeassistant-custom-component==0.13.232
          - homeassistant: latest pinned
            python: "3.14"
            install: -r requirements_test.txt
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install dependencies
        run: pip install ${{ matrix.install }}
      - name: Pytest
        run: pytest
